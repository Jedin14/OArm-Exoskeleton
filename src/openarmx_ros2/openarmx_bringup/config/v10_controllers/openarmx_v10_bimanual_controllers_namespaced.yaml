      openarmx_right_joint4: {trajectory: 0.1, goal: 0.1}
      openarmx_right_joint5: {trajectory: 0.1, goal: 0.1}
      openarmx_right_joint6: {trajectory: 0.1, goal: 0.1}
      openarmx_right_joint7: {trajectory: 0.1, goal: 0.1}

/**/left_forward_position_controller:
  ros__parameters:
